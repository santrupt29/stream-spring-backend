spring.application.name=spring-stream-backend

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/videodb}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:1710}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

files.video=videos/
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

file.video.hsl=videos_hsl/

# JWT - generate a stable base64 key and set via env var in production
# To generate: openssl rand -base64 32
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLWRlZmF1bHQtZGV2LWtleS1jaGFuZ2UtaW4tcHJvZA==}

cloud.aws.credentials.access-key=${CLOUD_AWS_CREDENTIALS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${CLOUD_AWS_CREDENTIALS_SECRET_KEY}
cloud.aws.region.static=sgp1
cloud.aws.endpoint=https://sgp1.digitaloceanspaces.com
cloud.aws.bucket.name=stream-app-storage
cloud.aws.cdn.url=https://stream-app-storage.sgp1.cdn.digitaloceanspaces.com


# Actuator - expose only health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
